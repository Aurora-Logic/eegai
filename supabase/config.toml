project_id = "wall-of-kindness"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Phone OTP is the only entry point (PLAN.md §3). Email sign-up stays off so
# nobody accidentally builds against it.
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Wall of Kindness code is {{ .Code }}"

# Local dev never sends a real SMS. These numbers log in with the fixed OTP
# below, which is what the Playwright flows use.
[auth.sms.test_otp]
9820000001 = "123456"
9820000002 = "123456"
9820000003 = "123456"
9820000004 = "123456"

# Production uses MSG91. Credentials come from the environment, never this file.
[auth.sms.messagebird]
enabled = false

[analytics]
enabled = false
