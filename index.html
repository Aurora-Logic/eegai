<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EBE7DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#21324F" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="EEGAI connects people, organisations and verified institutions in Coimbatore so unused things reach those who need them."
    />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EEGAI" />

    <!--
      Fonts are loaded from Google Fonts for now. Self-hosting is an M8 hardening
      task — most donors are on patchy 4G and a third-party round trip is real
      latency. See NOTES.md.

      Tamil subsets are requested up front, not lazily: Tamil strings land
      later and the metrics must already be settled.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..600&family=Noto+Sans+Tamil:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>EEGAI — Where giving finds its way</title>
    <script>
      // The theme, before first paint.
      //
      // useTheme() owns the toggle, but it only runs once a component that
      // calls it mounts — which never happens on the landing, sign-in or legal
      // pages. A visitor who prefers dark got a light page inside the dark
      // browser chrome the meta tags above had already asked for, and somebody
      // who chose dark in the app saw it forgotten every time they signed out.
      try {
        var saved = localStorage.getItem('eegai.theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (error) {
        // Private mode, or storage blocked. Light is the designed default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
