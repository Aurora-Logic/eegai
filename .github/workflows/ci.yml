name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The RLS and state-machine suites run against a real Postgres as the
    # non-BYPASSRLS app role. Testing them against a mock would prove nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      APP_DB_PASSWORD: wok_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Proves the schema rebuilds from db/migrations with zero manual steps.
      - name: Build the database
        run: |
          npm run db:setup
          npm run db:reset
          npm run db:reset:test

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # The quality floor is 250KB gzipped app JS (PLAN.md §8). Failing here is
      # the point — a regression should block the PR, not show up in Lighthouse
      # after the pilot has started.
      - name: JS budget
        run: node scripts/check-bundle-size.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      APP_DB_PASSWORD: wok_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build the database
        run: |
          npm run db:setup
          npm run db:reset

      # playwright.config.ts starts the full stack itself via `npm run dev`.
      - name: Critical flows
        run: npm run test:e2e
        env:
          PGUSER: wok_app
          PGPASSWORD: wok_ci
          PGDATABASE: wall_of_kindness

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
